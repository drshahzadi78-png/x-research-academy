<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For Roja</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      background: #2a0f1e;
      color: #ffffff;
      font-family: Georgia, serif;
    }
    .heart {
      font-size: 3rem;
      color: #ff5c8a;
      animation: pulse 1.2s ease-in-out infinite;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      margin: 1rem 0;
      opacity: 0;
      animation: rise 1.5s ease forwards;
    }
    /* The second line types itself out, one letter at a time */
    .typed {
      font-family: "Courier New", monospace;
      font-size: clamp(1.1rem, 5vw, 2rem);
      color: #ffb3cf;
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      border-right: 3px solid transparent;
      animation: typing 2.5s steps(21) 1.8s forwards,
                 blink 0.8s step-end 1.8s infinite;
    }
    a { color: #ffb3cf; margin-top: 3rem; }

    @keyframes rise   { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes typing { to { width: 21ch; } }
    @keyframes blink  { 50% { border-color: #ffb3cf; } }
    @keyframes pulse  { 50% { transform: scale(1.2); } }

    /* People who turn animations off in their settings see the text right away */
    @media (prefers-reduced-motion: reduce) {
      .heart, h1, .typed { animation: none; }
      h1 { opacity: 1; }
      .typed { width: auto; white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="heart">❤</div>
  <h1>I love you Roja</h1>
  <p class="typed">You are my everything</p>
  <a href="index.html">Back to home</a>
</body>
</html>
